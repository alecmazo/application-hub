<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#0a1628" />
    <title>MarinFC-reports</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a1628;
        --elevated: #0f1f35;
        --card: #12233c;
        --fg: #e8eef6;
        --muted: #8fa3bc;
        --primary: #5bb8d4;
        --primary-fg: #061018;
        --border: color-mix(in oklab, #e8eef6 12%, transparent);
        --danger: #e07070;
        --sans: "DM Sans", ui-sans-serif, system-ui, sans-serif;
        --display: "Fraunces", ui-serif, Georgia, serif;
        --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        color: var(--fg);
        font-family: var(--sans);
        line-height: 1.5;
        background:
          radial-gradient(
            900px 480px at 12% -10%,
            color-mix(in oklab, var(--primary) 14%, transparent),
            transparent 60%
          ),
          radial-gradient(
            700px 420px at 92% 0%,
            color-mix(in oklab, #2a4a78 30%, transparent),
            transparent 55%
          ),
          var(--bg);
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: var(--primary);
      }

      .page {
        width: min(72rem, calc(100% - 2rem));
        margin: 0 auto;
        padding: 2rem 0 4rem;
      }

      .kicker {
        margin: 0 0 0.35rem;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .kicker a {
        color: inherit;
        text-decoration: none;
      }

      .kicker a:hover {
        color: var(--primary);
      }

      h1 {
        margin: 0;
        font-family: var(--display);
        font-size: clamp(1.8rem, 4vw, 2.4rem);
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.15;
      }

      .lede {
        max-width: 40rem;
        margin: 0.85rem 0 0;
        color: var(--muted);
        font-size: 1rem;
      }

      .meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1rem;
        margin-top: 1.25rem;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 0.78rem;
      }

      .list {
        display: grid;
        gap: 1rem;
        margin-top: 1.75rem;
      }

      @media (min-width: 720px) {
        .list {
          grid-template-columns: 1fr 1fr;
        }
      }

      .card {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        min-width: 0;
        padding: 1.15rem 1.15rem 1rem;
        border: 1px solid var(--border);
        border-radius: 1.25rem;
        background: color-mix(in oklab, var(--card) 92%, transparent);
        box-shadow: 0 1px 0 color-mix(in oklab, #fff 4%, transparent) inset;
        transition:
          transform 200ms cubic-bezier(0.22, 1, 0.36, 1),
          border-color 200ms ease,
          box-shadow 200ms ease;
      }

      .card:hover {
        transform: translateY(-2px);
        border-color: color-mix(in oklab, var(--primary) 35%, transparent);
        box-shadow: 0 12px 40px -20px color-mix(in oklab, #000 70%, transparent);
      }

      .card h2 {
        margin: 0;
        font-family: var(--display);
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.3;
      }

      .date {
        margin: 0.35rem 0 0;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 0.78rem;
        font-variant-numeric: tabular-nums;
      }

      .desc {
        margin: 0;
        flex: 1;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .path {
        margin: 0;
        overflow-wrap: anywhere;
        color: color-mix(in oklab, var(--muted) 85%, var(--fg));
        font-family: var(--mono);
        font-size: 0.72rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 0.25rem;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0.55rem 0.95rem;
        border-radius: 0.75rem;
        border: 1px solid transparent;
        font: 600 0.92rem/1 var(--sans);
        text-decoration: none;
        cursor: pointer;
      }

      .btn-primary {
        background: var(--primary);
        color: var(--primary-fg);
      }

      .btn-primary:hover {
        filter: brightness(1.06);
      }

      .btn-outline {
        background: transparent;
        border-color: var(--border);
        color: var(--fg);
      }

      .btn-outline:hover {
        border-color: color-mix(in oklab, var(--primary) 45%, transparent);
        background: color-mix(in oklab, var(--primary) 10%, transparent);
      }

      .btn[aria-pressed="true"] {
        border-color: color-mix(in oklab, var(--primary) 50%, transparent);
        color: var(--primary);
      }

      .status,
      .empty {
        margin-top: 1.5rem;
        padding: 1rem 1.1rem;
        border: 1px solid var(--border);
        border-radius: 1rem;
        background: var(--elevated);
        color: var(--muted);
      }

      .status[data-kind="error"] {
        border-color: color-mix(in oklab, var(--danger) 45%, transparent);
        color: var(--fg);
      }

      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 480px) {
        .page {
          width: min(72rem, calc(100% - 1.25rem));
          padding-top: 1.35rem;
        }

        .actions {
          flex-direction: column;
        }

        .btn {
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .card,
        .card:hover {
          transition: none;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <p class="kicker"><a href="../">Application hub</a></p>
      <h1>MarinFC-reports</h1>
      <p class="lede">
        Marin FC coaching reports. Open one here, or copy its link to send that
        report on its own. A report page does not link back to this list or to
        any other report.
      </p>
      <p class="meta-row" id="count">Loading reports…</p>
      <div id="status" class="status" hidden></div>
      <div class="list" id="list"></div>
      <p class="sr" id="live" aria-live="polite"></p>
    </div>
    <noscript>
      <p class="status" style="width: min(72rem, calc(100% - 2rem)); margin: 1rem auto">
        This dashboard needs JavaScript to read reports.json.
      </p>
    </noscript>
    <script>
      const SLUG = /^[A-Za-z0-9][A-Za-z0-9_-]{7,80}$/;
      const listEl = document.getElementById("list");
      const statusEl = document.getElementById("status");
      const countEl = document.getElementById("count");
      const liveEl = document.getElementById("live");

      function directoryBase() {
        const here = new URL(document.baseURI);
        let path = here.pathname;
        if (path.endsWith("/index.html")) path = path.slice(0, -"index.html".length);
        if (!path.endsWith("/")) path += "/";
        return new URL(path, here.origin);
      }

      function reportUrl(slug) {
        return new URL(encodeURI(slug) + "/", directoryBase()).href;
      }

      function formatDate(iso) {
        const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
        if (!match) return null;
        const year = Number(match[1]);
        const month = Number(match[2]);
        const day = Number(match[3]);
        const utc = new Date(Date.UTC(year, month - 1, day));
        if (
          utc.getUTCFullYear() !== year ||
          utc.getUTCMonth() !== month - 1 ||
          utc.getUTCDate() !== day
        ) {
          return null;
        }
        return new Intl.DateTimeFormat("en-US", {
          month: "short",
          day: "numeric",
          year: "numeric",
          timeZone: "UTC",
        }).format(utc);
      }

      function showStatus(message, kind) {
        statusEl.hidden = false;
        statusEl.dataset.kind = kind || "info";
        statusEl.textContent = message;
      }

      function clearStatus() {
        statusEl.hidden = true;
        statusEl.textContent = "";
        delete statusEl.dataset.kind;
      }

      function card(report) {
        const article = document.createElement("article");
        article.className = "card";

        const h2 = document.createElement("h2");
        h2.textContent = report.title;

        const date = document.createElement("p");
        date.className = "date";
        date.textContent = report.dateLabel;

        const desc = document.createElement("p");
        desc.className = "desc";
        desc.textContent = report.description;

        const path = document.createElement("p");
        path.className = "path";
        const url = new URL(report.href);
        path.textContent = url.pathname;

        const actions = document.createElement("div");
        actions.className = "actions";

        const open = document.createElement("a");
        open.className = "btn btn-primary";
        open.href = report.href;
        open.textContent = "Open";

        const copy = document.createElement("button");
        copy.type = "button";
        copy.className = "btn btn-outline";
        copy.textContent = "Copy link";
        copy.setAttribute("aria-label", "Copy link to " + report.title);
        copy.addEventListener("click", () => copyLink(copy, report.href, report.title));

        actions.append(open, copy);
        article.append(h2, date, desc, path, actions);
        return article;
      }

      async function copyLink(button, href, title) {
        let ok = false;
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(href);
            ok = true;
          }
        } catch {
          ok = false;
        }
        if (!ok) {
          const input = document.createElement("textarea");
          input.value = href;
          input.setAttribute("readonly", "");
          input.style.position = "fixed";
          input.style.left = "-9999px";
          document.body.append(input);
          input.select();
          try {
            ok = document.execCommand("copy");
          } catch {
            ok = false;
          }
          input.remove();
        }
        if (ok) {
          button.textContent = "Copied";
          button.setAttribute("aria-pressed", "true");
          liveEl.textContent = "Copied link for " + title;
          window.setTimeout(() => {
            button.textContent = "Copy link";
            button.removeAttribute("aria-pressed");
          }, 1800);
        } else {
          button.textContent = "Copy failed";
          liveEl.textContent = "Could not copy the link. The address is shown on the card.";
          window.setTimeout(() => {
            button.textContent = "Copy link";
          }, 1800);
        }
      }

      function normalize(raw, index) {
        if (!raw || typeof raw !== "object") return null;
        const slug = typeof raw.slug === "string" ? raw.slug.trim() : "";
        const title = typeof raw.title === "string" ? raw.title.trim() : "";
        const description =
          typeof raw.description === "string" ? raw.description.trim() : "";
        const date = typeof raw.date === "string" ? raw.date.trim() : "";
        const dateLabel = formatDate(date);
        if (!SLUG.test(slug) || !title || !description || !dateLabel) return null;
        return { slug, title, description, date, dateLabel, index, href: reportUrl(slug) };
      }

      async function load() {
        const manifestUrl = new URL("reports.json", directoryBase());
        let payload;
        try {
          const res = await fetch(manifestUrl, { cache: "no-store" });
          if (!res.ok) throw new Error("HTTP " + res.status);
          payload = await res.json();
        } catch {
          countEl.textContent = "Could not load reports";
          showStatus(
            "reports.json did not load. Check that the file sits next to this page.",
            "error",
          );
          return;
        }

        const rows = Array.isArray(payload.reports) ? payload.reports : null;
        if (!rows) {
          countEl.textContent = "Could not load reports";
          showStatus("reports.json needs a reports array.", "error");
          return;
        }

        const reports = [];
        let skipped = 0;
        rows.forEach((row, index) => {
          const item = normalize(row, index);
          if (item) reports.push(item);
          else skipped += 1;
        });

        reports.sort((a, b) => {
          if (a.date !== b.date) return a.date < b.date ? 1 : -1;
          return a.index - b.index;
        });

        listEl.replaceChildren();
        if (reports.length === 0) {
          countEl.textContent = "No reports yet";
          showStatus("Add a folder and one entry in reports.json. See the README in this folder.", "info");
          return;
        }

        clearStatus();
        if (skipped) {
          showStatus(
            skipped +
              (skipped === 1 ? " entry was" : " entries were") +
              " skipped. Each report needs a slug, title, YYYY-MM-DD date, and description.",
            "error",
          );
        }
        countEl.textContent =
          reports.length + (reports.length === 1 ? " report" : " reports");
        const frag = document.createDocumentFragment();
        reports.forEach((report) => frag.append(card(report)));
        listEl.append(frag);
      }

      load();
    </script>
  </body>
</html>
